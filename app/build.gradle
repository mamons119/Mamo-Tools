plugins {
    id 'com.android.application'
}

android {
    namespace 'it.mamotools'
    compileSdk 34

    defaultConfig {
        applicationId "it.mamotools"
        minSdk 29             // Android 10+ (salvataggio in Galleria senza permessi di archiviazione)
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // firmato con la chiave di debug cosi' si installa direttamente
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
