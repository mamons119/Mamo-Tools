plugins {
    id 'com.android.application'
}

android {
    namespace 'it.mamotools'
    compileSdk 34

    defaultConfig {
        applicationId "it.mamotools"
        minSdk 29             // Android 10+ (salvataggio in Galleria senza permessi di archiviazione)
        targetSdk 33
        versionCode 48
        versionName "3.10"
    }

    signingConfigs {
        // chiave fissa inclusa nel progetto: ogni build ha la stessa firma, quindi Android
        // aggiorna l'app mantenendo i dati (sessioni, impostazioni)
        mamo {
            storeFile file('mamotools.jks')
            storePassword 'mamotools'
            keyAlias 'mamotools'
            keyPassword 'mamotools'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.mamo
        }
        debug {
            signingConfig signingConfigs.mamo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // lettura del testo dei PDF (per la conversione PDF -> Word)
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
