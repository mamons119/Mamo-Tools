name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # serve per pubblicare la Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accetta licenze SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MamoTools-apk
          path: app/build/outputs/apk/release/*.apk

      # Pubblica l'APK in una Release (github.com/<utente>/<repo>/releases): si scarica con un tocco dal telefono
      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "MamoTools-$VER.apk"
          gh release delete "v$VER" --yes --cleanup-tag || true
          gh release create "v$VER" "MamoTools-$VER.apk" \
            --title "Mamo Tools $VER" \
            --notes "APK di Mamo Tools $VER (compilato automaticamente)." \
            --latest
